<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>M7 Studio Editor</title>
    <style>
      :root {
        --bg: #0f0f10;
        --panel: #18181b;
        --line: #2a2a2e;
        --text: #ececec;
        --muted: #9a9aa2;
        --accent: #e8ff47;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 system-ui,
          sans-serif;
        height: 100vh;
        display: flex;
      }
      aside {
        width: 380px;
        min-width: 300px;
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      header span {
        color: var(--accent);
      }
      #log {
        flex: 1;
        overflow: auto;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        padding: 8px 10px;
        border-radius: 8px;
        max-width: 95%;
        white-space: pre-wrap;
      }
      .me {
        align-self: flex-end;
        background: #2b2f12;
      }
      .bot {
        align-self: flex-start;
        background: #222226;
        color: #d8d8dc;
      }
      .err {
        background: #3a1717;
      }
      form {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--line);
      }
      input[type='text'] {
        flex: 1;
        background: #0f0f10;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 6px;
        padding: 9px 10px;
      }
      button {
        background: #2a2a2e;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 7px 10px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #111;
        border-color: var(--accent);
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      #chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0 16px 12px;
      }
      #chips button {
        font-size: 12px;
        padding: 4px 8px;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #toolbar {
        display: flex;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        align-items: center;
        flex-wrap: wrap;
      }
      #toolbar .grow {
        flex: 1;
        color: var(--muted);
      }
      #stage {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #compare {
        position: relative;
        max-width: 100%;
        max-height: 100%;
        user-select: none;
      }
      #compare img {
        display: block;
        max-width: calc(100vw - 420px);
        max-height: calc(100vh - 160px);
      }
      #afterWrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #afterWrap img {
        position: absolute;
        left: 0;
        top: 0;
      }
      #handle {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--accent);
        cursor: ew-resize;
      }
      .tag {
        position: absolute;
        top: 8px;
        background: #000a;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 12px;
      }
      #drop {
        border: 2px dashed var(--line);
        border-radius: 12px;
        padding: 60px;
        text-align: center;
        color: var(--muted);
      }
      #history {
        padding: 8px 16px;
        border-top: 1px solid var(--line);
        max-height: 160px;
        overflow: auto;
        font-size: 12px;
      }
      #history div {
        cursor: pointer;
        padding: 2px 0;
        color: var(--muted);
      }
      #history div.cur {
        color: var(--accent);
      }
      @media (max-width: 800px) {
        body {
          flex-direction: column;
        }
        aside {
          width: 100%;
          height: 50vh;
        }
        #compare img {
          max-width: 100vw;
          max-height: 45vh;
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <header>M7 <span>STUDIO</span> EDITOR</header>
      <div id="log">
        <div class="msg bot">
          Upload a photo (ARW, JPEG, PNG, TIFF), then tell me how you want it edited. Examples: "cinematic sports at
          80%", "lift the shadows a bit and make it warmer", "darken the background", "crop 4:5", "undo".
        </div>
      </div>
      <div id="chips"></div>
      <form id="f">
        <input id="t" type="text" placeholder="Describe the edit…" autocomplete="off" /><button
          class="primary"
          id="send"
        >
          Send
        </button>
      </form>
      <div id="history"></div>
    </aside>
    <main>
      <div id="toolbar">
        <input type="file" id="file" accept=".arw,.ARW,.jpg,.jpeg,.png,.tif,.tiff,.dng,.cr2,.cr3,.nef,.raf" hidden />
        <button onclick="file.click()">Upload photo</button>
        <button onclick="chat('undo')">Undo</button>
        <button onclick="chat('redo')">Redo</button>
        <span class="grow" id="info"></span>
        <button onclick="exportAs('jpeg')">Export JPEG</button>
        <button onclick="exportAs('tiff')">Export 16-bit TIFF</button>
      </div>
      <div id="stage">
        <div id="drop">Drop a photo here or click “Upload photo”.<br /><small>Processing is 100% local.</small></div>
      </div>
    </main>
    <script>
      let S = null;
      let busy = false;
      const log = document.getElementById('log'),
        stage = document.getElementById('stage');
      function say(text, cls = 'bot') {
        const d = document.createElement('div');
        d.className = 'msg ' + cls;
        d.textContent = text;
        log.appendChild(d);
        log.scrollTop = 1e9;
        return d;
      }
      function setBusy(b) {
        busy = b;
        document.querySelectorAll('button').forEach((x) => (x.disabled = b));
      }
      async function post(url, body, headers = { 'Content-Type': 'application/json' }) {
        const r = await fetch(url, { method: 'POST', headers, body });
        const j = await r.json();
        if (!r.ok || j.error) throw new Error(j.error || r.statusText);
        return j;
      }
      function render(st) {
        S = st;
        stage.innerHTML = `<div id="compare"><img id="b" src="${st.before}"><div id="afterWrap"><img id="a" src="${st.after}"></div>
    <div id="handle"></div><span class="tag" style="left:8px">BEFORE</span><span class="tag" style="right:8px">AFTER</span></div>`;
        const cmp = document.getElementById('compare'),
          wrap = document.getElementById('afterWrap'),
          h = document.getElementById('handle'),
          a = document.getElementById('a'),
          b = document.getElementById('b');
        const set = (f) => {
          wrap.style.clipPath = `inset(0 0 0 ${f * 100}%)`;
          h.style.left = f * 100 + '%';
        };
        const fit = () => {
          if (!b.naturalWidth || !a.naturalWidth) return;
          const ra = a.naturalWidth / a.naturalHeight,
            rb = b.naturalWidth / b.naturalHeight;
          if (Math.abs(ra - rb) / rb > 0.01) {
            // cropped: a wipe would distort, show side by side
            stage.innerHTML = `<div id="compare"><img src="${st.compare}"></div>`;
            return;
          }
          a.style.width = b.clientWidth + 'px';
          a.style.height = b.clientHeight + 'px';
          set(0.5);
        };
        b.onload = fit;
        a.onload = fit;
        let drag = false;
        h.onpointerdown = (e) => {
          drag = true;
          h.setPointerCapture(e.pointerId);
        };
        h.onpointerup = () => (drag = false);
        h.onpointermove = (e) => {
          if (!drag) return;
          const r = cmp.getBoundingClientRect();
          set(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)));
        };
        document.getElementById('info').textContent = `${st.source} · ${st.size[0]}×${st.size[1]} · step ${st.step}`;
        const hist = document.getElementById('history');
        hist.innerHTML = '<b>History</b>';
        st.history.forEach((e) => {
          const d = document.createElement('div');
          d.textContent = `${e.step}. ${e.note}`;
          if (e.current) d.className = 'cur';
          d.onclick = () => go(e.step);
          hist.appendChild(d);
        });
        if (st.interpreted && st.interpreted.length) say(st.interpreted.join('\n'));
      }
      async function upload(f) {
        if (busy) return;
        setBusy(true);
        const w = say(`Uploading ${f.name} and developing a neutral preview…`);
        try {
          render(await post('/api/upload', f, { 'X-Filename': encodeURIComponent(f.name) }));
        } catch (e) {
          w.classList.add('err');
          w.textContent = e.message;
        } finally {
          setBusy(false);
        }
      }
      async function chat(text) {
        if (!S) {
          say('Upload a photo first.');
          return;
        }
        if (busy) return;
        say(text, 'me');
        setBusy(true);
        const w = say('Rendering with RapidRAW…');
        try {
          const st = await post('/api/chat', JSON.stringify({ session: S.session, text }));
          w.remove();
          render(st);
        } catch (e) {
          w.classList.add('err');
          w.textContent = e.message;
        } finally {
          setBusy(false);
        }
      }
      async function go(step) {
        if (busy) return;
        setBusy(true);
        try {
          render(await post('/api/goto', JSON.stringify({ session: S.session, step })));
        } catch (e) {
          say(e.message, 'bot err');
        } finally {
          setBusy(false);
        }
      }
      async function exportAs(format) {
        if (!S || busy) return;
        setBusy(true);
        const w = say(`Exporting full-resolution ${format.toUpperCase()}…`);
        try {
          const r = await post('/api/export', JSON.stringify({ session: S.session, format }));
          w.textContent = `Exported ${r.size[0]}×${r.size[1]} in ${r.seconds}s. `;
          const a = document.createElement('a');
          a.href = r.download;
          a.textContent = 'Download';
          a.style.color = 'var(--accent)';
          w.appendChild(a);
          a.click();
        } catch (e) {
          w.classList.add('err');
          w.textContent = e.message;
        } finally {
          setBusy(false);
        }
      }
      document.getElementById('f').onsubmit = (e) => {
        e.preventDefault();
        const t = document.getElementById('t');
        if (t.value.trim()) {
          chat(t.value.trim());
          t.value = '';
        }
      };
      document.getElementById('file').onchange = (e) => e.target.files[0] && upload(e.target.files[0]);
      stage.ondragover = (e) => e.preventDefault();
      stage.ondrop = (e) => {
        e.preventDefault();
        e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]);
      };
      fetch('/api/presets')
        .then((r) => r.json())
        .then((ps) => {
          const c = document.getElementById('chips');
          ps.forEach((p) => {
            const b = document.createElement('button');
            b.textContent = p.title;
            b.title = p.description;
            b.onclick = () => chat(p.title);
            c.appendChild(b);
          });
        });
    </script>
  </body>
</html>
